<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>Employee Passport</h2>

        <a href="employee-dashboard.html">
            Dashboard
        </a>

        <a href="my-profile.html" class="active">
            My Profile
        </a>

        <a href="my-passport.html">
            My Passport
        </a>

    </aside>


    <main class="main-content">

        <div class="dashboard-header">

            <div>
                <h1>My Profile</h1>
                <p>View and update your personal details</p>
            </div>

        </div>


        <div class="employee-form" id="profileForm">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="profileName"
                    placeholder="Enter your name">

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="profileEmail"
                    readonly>

            </div>


            <div class="form-group">

                <label>Contact Number</label>

                <input
                    type="text"
                    id="profileContact"
                    placeholder="Enter contact number">

            </div>


            <div class="form-group">

                <label>Department</label>

                <input
                    type="text"
                    id="profileDepartment"
                    placeholder="Enter department">

            </div>


            <div class="form-group">

                <label>Role</label>

                <input
                    type="text"
                    id="profileRole"
                    readonly>

            </div>


            <button type="button" id="updateProfileBtn">
                Update Profile
            </button>

        </div>


        <p id="profileMessage"></p>

    </main>

</div>


<script src="../JAVASCRIPT/my-profile.js"></script>

</body>

</html>
