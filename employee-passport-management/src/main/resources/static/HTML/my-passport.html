<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Passport</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>Employee Passport</h2>

        <a href="employee-dashboard.html">
            Dashboard
        </a>

        <a href="my-profile.html">
            My Profile
        </a>

        <a href="my-passport.html" class="active">
            My Passport
        </a>

    </aside>


    <main class="main-content">

        <div class="dashboard-header">

            <div>
                <h1>My Passport</h1>
                <p>View and update your passport details</p>
            </div>

        </div>


        <div class="employee-form">

            <div class="form-group">

                <label>Passport Number</label>

                <input
                    type="text"
                    id="myPassportNo"
                    placeholder="Enter passport number">

            </div>


            <div class="form-group">

                <label>Issue Date</label>

                <input
                    type="date"
                    id="myIssueDate">

            </div>


            <div class="form-group">

                <label>Expiry Date</label>

                <input
                    type="date"
                    id="myExpiryDate">

            </div>


            <div class="form-group">

                <label>Nationality</label>

                <input
                    type="text"
                    id="myNationality"
                    placeholder="Enter nationality">

            </div>


            <button type="button" id="updatePassportBtn">
                Update Passport
            </button>

        </div>


        <p id="passportMessage"></p>

    </main>

</div>


<script src="../JAVASCRIPT/my-passport.js"></script>

</body>

</html>
